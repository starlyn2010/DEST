[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dest"
version = "1.0.0"
description = "Deterministic Collatz Sampling for Reproducible Deep Learning"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Starlyn" }]
keywords = ["deep-learning", "reproducibility", "collatz", "sampling", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.1",
  "black>=24",
]

[project.urls]
Homepage = "https://github.com/starlyn2010/DEST"
Repository = "https://github.com/starlyn2010/DEST"
Issues = "https://github.com/starlyn2010/DEST/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
